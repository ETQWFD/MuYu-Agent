name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble APK
        run: ./gradlew :app:assembleDebug -PmcaQnnTypedBindingsRequired=false -PmcaMnnVendorRequired=false -PmcaWithMnnDiffusion=false -Pmca.abis=arm64-v8a,armeabi-v7a -Pmca.composeCompilerReports=false --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/MuYu-Agent-0.4.0-universal.apk
          cd dist
          sha256sum MuYu-Agent-0.4.0-universal.apk > MuYu-Agent-0.4.0-universal.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MuYu-Agent-apk
          path: dist/*
          if-no-files-found: error
