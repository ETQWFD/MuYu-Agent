name: Build APK (MuYu-Agent)

# Produces the installable MuYu-Agent APK from this tree.
#
# Why this job exists: the upstream project's release path expects a local QAIRT/QNN SDK plus a
# Windows-built MNN runtime. Neither is redistributable, so this job builds the same Java/Kotlin
# product with the documented stub bindings instead of failing closed:
#
#   -PmcaQnnTypedBindingsRequired=false   -> QNN JNI surface compiles as a stub
#   -PmcaMnnVendorRequired=false          -> MNN delegate is not required to be staged
#   -PmcaWithMnnDiffusion=false           -> the diffusion shim is left out
#
# What that means for the artifact: cloud/API chat, model management, settings, agent workspace,
# and llama.cpp text inference work; Qualcomm NPU image generation and the MNN/Qwen-Image runtimes
# are not packaged (they are arm64-only vendor binaries). 32-bit (`armeabi-v7a`) installs run the
# full UI and cloud paths, and the app reports the unavailable vendor NPU instead of crashing.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  apk:
    name: Assemble universal APK (arm64 + armeabi-v7a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Assemble APK
        run: |
          ./gradlew :app:assembleDebug \
            -PmcaQnnTypedBindingsRequired=false \
            -PmcaMnnVendorRequired=false \
            -PmcaWithMnnDiffusion=false \
            -Pmca.abis=arm64-v8a,armeabi-v7a \
            -Pmca.composeCompilerReports=false \
            --stacktrace

      - name: Collect APK and checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/MuYu-Agent-0.4.0-universal.apk
          cd dist && sha256sum *.apk | tee MuYu-Agent-0.4.0-universal.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuYu-Agent-apk
          path: dist/*
          if-no-files-found: error
